# Round-robin load balancer over two backend replicas (compose profile `replicas`).
# Plain round-robin, no sticky sessions: a WebSocket and the requests that cause its events
# usually land on different replicas, which is what the Redis bus (DECISIONS #025) is for.
upstream backends {
  server backend:8000;
  server backend-2:8000;
}

server {
  listen 80;

  location / {
    proxy_pass http://backends;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header Host $http_host;
    # Overwrite, never append ($proxy_add_x_forwarded_for): uvicorn takes the first entry,
    # so a client-supplied one would choose its own IP for login throttling (DECISIONS #027).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 1h;
  }
}
