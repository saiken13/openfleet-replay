# Auth (DECISIONS #021, #022): this local stack seeds PUBLIC demo credentials so the demo,
# CI and the ROS e2e need zero setup: robot keys (examples/demo-robot-keys.json) and users
# operator/operator-demo + viewer/viewer-demo with a viewer API token
# (examples/demo-users.json). Never use them on a reachable deployment: drop the
# OPENFLEET_ROBOT_KEYS_FILE / OPENFLEET_USERS_FILE / OPENFLEET_LOGIN_HINT lines and run
#   docker compose exec backend openfleet keys create ROBOT_ID
#   docker compose exec backend openfleet users create NAME --role operator
x-demo-keys: &demo-keys ./examples/demo-robot-keys.json:/etc/openfleet/demo-robot-keys.json:ro
x-demo-users: &demo-users ./examples/demo-users.json:/etc/openfleet/demo-users.json:ro

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: openfleet
      POSTGRES_PASSWORD: openfleet  # local development only
      POSTGRES_DB: openfleet
    ports:
      - "${OPENFLEET_PG_HOST_PORT:-5433}:5432"  # 5433 on the host avoids clashing with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfleet -d openfleet"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Realtime fan-out between backend replicas (DECISIONS #025). Ephemeral: no volume.
  redis:
    image: redis:7-alpine
    ports:
      - "${OPENFLEET_REDIS_HOST_PORT:-6380}:6379"  # 6380 on the host avoids clashing with a local Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment:
      OPENFLEET_DATABASE_URL: postgresql+asyncpg://openfleet:openfleet@postgres:5432/openfleet
      OPENFLEET_REDIS_URL: redis://redis:6379/0
      OPENFLEET_CORS_ORIGINS: '["http://localhost:5173", "http://localhost:8080"]'
      OPENFLEET_ROBOT_KEYS_FILE: /etc/openfleet/demo-robot-keys.json
      OPENFLEET_USERS_FILE: /etc/openfleet/demo-users.json
      OPENFLEET_LOGIN_HINT: "Demo: operator / operator-demo (can triage) or viewer / viewer-demo"
    volumes:
      - *demo-keys
      - *demo-users
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Dashboard (static build behind nginx, which also proxies /api and WebSockets)
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  # Simulated fleet running the demo scenario in a loop. Opt in:  docker compose --profile demo up
  simulator:
    build: ./simulator
    profiles: [demo]
    environment:
      OPENFLEET_API: http://backend:8000
      OPENFLEET_ROBOT_KEYS_FILE: /etc/openfleet/demo-robot-keys.json
    volumes:
      - *demo-keys
    command: ["openfleet-sim", "--scenario", "scenarios/demo.yaml", "--loop"]
    depends_on:
      backend:
        condition: service_healthy

  # ROS 2 collector integration test: a fake robot (ROS 2 Jazzy) + the real collector.
  # Opt in:  docker compose --profile ros up
  ros-robot:
    build: ./collector
    profiles: [ros]
    command: ["python3", "ros_test/fake_robot.py"]
    environment:
      ROS_DOMAIN_ID: "42"
    volumes:
      - rosctl:/tmp

  ros-collector:
    build: ./collector
    profiles: [ros]
    command: ["openfleet-collector", "--config", "ros_test/collector.test.yaml"]
    environment:
      ROS_DOMAIN_ID: "42"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  rosctl:
