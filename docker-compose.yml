# Auth (DECISIONS #021, #022): this local stack seeds PUBLIC demo credentials so the demo,
# CI and the ROS e2e need zero setup: robot keys (examples/demo-robot-keys.json) and users
# operator/operator-demo + viewer/viewer-demo with a viewer API token
# (examples/demo-users.json). Never use them on a reachable deployment: drop the
# OPENFLEET_ROBOT_KEYS_FILE / OPENFLEET_USERS_FILE / OPENFLEET_LOGIN_HINT lines and run
#   docker compose exec backend openfleet keys create ROBOT_ID
#   docker compose exec backend openfleet users create NAME --role operator
x-demo-keys: &demo-keys ./examples/demo-robot-keys.json:/etc/openfleet/demo-robot-keys.json:ro
x-demo-users: &demo-users ./examples/demo-users.json:/etc/openfleet/demo-users.json:ro

x-backend: &backend
  build: ./backend
  environment:
    OPENFLEET_DATABASE_URL: postgresql+asyncpg://openfleet:openfleet@postgres:5432/openfleet
    OPENFLEET_REDIS_URL: redis://redis:6379/0
    OPENFLEET_CORS_ORIGINS: '["http://localhost:5173", "http://localhost:8080"]'
    OPENFLEET_ROBOT_KEYS_FILE: /etc/openfleet/demo-robot-keys.json
    OPENFLEET_USERS_FILE: /etc/openfleet/demo-users.json
    OPENFLEET_LOGIN_HINT: "Demo: operator / operator-demo (can triage) or viewer / viewer-demo"
    # uvicorn takes the client IP (for login throttling, DECISIONS #027) from X-Forwarded-For
    # sent by these addresses. "*" because the nginx containers' IPs aren't fixed; the proxies
    # overwrite the header, so it can't be spoofed through them. It CAN be spoofed by calling
    # the published :8000 directly, which a real deployment shouldn't expose: there, set this
    # to the proxy's address.
    FORWARDED_ALLOW_IPS: "*"
  volumes:
    - *demo-keys
    - *demo-users
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)"]
    interval: 3s
    timeout: 3s
    retries: 40

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: openfleet
      POSTGRES_PASSWORD: openfleet  # local development only
      POSTGRES_DB: openfleet
    ports:
      - "${OPENFLEET_PG_HOST_PORT:-5433}:5432"  # 5433 on the host avoids clashing with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfleet -d openfleet"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Realtime fan-out between backend replicas (DECISIONS #025). Ephemeral: no volume.
  redis:
    image: redis:7-alpine
    ports:
      - "${OPENFLEET_REDIS_HOST_PORT:-6380}:6379"  # 6380 on the host avoids clashing with a local Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    <<: *backend
    ports:
      - "8000:8000"

  # Multi-replica setup (DECISIONS #024, #025): a second backend plus an nginx that
  # round-robins between the two. Opt in:  docker compose --profile replicas up
  # E2E check:  python scripts/multi_replica_e2e.py
  backend-2:
    <<: *backend
    profiles: [replicas]
    ports:
      - "8001:8000"

  lb:
    image: nginx:1.27-alpine
    profiles: [replicas]
    volumes:
      - ./scripts/lb.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:80"
    depends_on:
      backend:
        condition: service_healthy
      backend-2:
        condition: service_healthy

  # Dashboard (static build behind nginx, which also proxies /api and WebSockets)
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  # Simulated fleet running the demo scenario in a loop. Opt in:  docker compose --profile demo up
  simulator:
    build: ./simulator
    profiles: [demo]
    environment:
      OPENFLEET_API: http://backend:8000
      OPENFLEET_ROBOT_KEYS_FILE: /etc/openfleet/demo-robot-keys.json
    volumes:
      - *demo-keys
    command: ["openfleet-sim", "--scenario", "scenarios/demo.yaml", "--loop"]
    depends_on:
      backend:
        condition: service_healthy

  # ROS 2 collector integration test: a fake robot (ROS 2 Jazzy) + the real collector.
  # Opt in:  docker compose --profile ros up
  ros-robot:
    build: ./collector
    profiles: [ros]
    command: ["python3", "ros_test/fake_robot.py"]
    environment:
      ROS_DOMAIN_ID: "42"
    volumes:
      - rosctl:/tmp

  ros-collector:
    build: ./collector
    profiles: [ros]
    command: ["openfleet-collector", "--config", "ros_test/collector.test.yaml"]
    environment:
      ROS_DOMAIN_ID: "42"
    depends_on:
      backend:
        condition: service_healthy

  # C++ edge agent (edge/, docs/EMBEDDED_ROADMAP.md Phases 1-2) as robot edge-01, plus a
  # stand-in "robot process" it watches (in the agent's PID namespace) and a simulated
  # microcontroller on a TCP "UART" (docs/PROTOCOL.md). Opt in:
  #   docker compose --profile edge up -d --build
  #   E2E checks: python edge/e2e/e2e.py; python edge/e2e/device_e2e.py
  edge-agent:
    build:
      context: .
      dockerfile: edge/docker/Dockerfile.agent
    image: openfleet-edge-agent
    profiles: [edge]
    init: true  # tini as PID 1: forwards SIGTERM, reaps orphans
    command:
      - --api=http://backend:8000
      - --robot-id=edge-01
      - --name=Edge agent 01
      - --model=linux-container
      - --process=demo-worker
      - --device=tcp://device-sim:4000  # mcu1: the device simulator
      - --device=tcp://renode:3456      # mcu2: the FreeRTOS firmware on Renode (profile firmware)
    environment:
      OPENFLEET_API_KEY: ofk_demo_edge-01_public-not-secret  # public demo key
    stop_grace_period: 20s  # flush (<= 5 s) + ending the run
    depends_on:
      backend:
        condition: service_healthy

  # Simulated MCU 1 (device protocol over TCP, like Renode's UART socket). Faults on demand:
  #   docker compose exec device-sim sh -c 'echo "stop-sensor 2" >> /tmp/devsim.ctl'
  device-sim:
    image: openfleet-edge-agent
    profiles: [edge]
    entrypoint: ["openfleet-device-sim", "--listen", "4000", "--control-file", "/tmp/devsim.ctl"]
    stop_grace_period: 2s
    depends_on:
      - edge-agent  # the same image; built by edge-agent

  # The FreeRTOS firmware (firmware/, docs/FIRMWARE.md) on Renode's emulated STM32F4: MCU 2,
  # its USART2 on TCP 3456 for the agent. Emulated hardware, not a board. Opt in:
  #   docker compose --profile edge --profile firmware up -d --build
  #   E2E check: python firmware/tests/firmware_e2e.py
  renode:
    build:
      context: .
      dockerfile: firmware/docker/Dockerfile.renode
    profiles: [firmware]
    stop_grace_period: 2s

  edge-worker:
    image: openfleet-edge-agent
    profiles: [edge]
    pid: "service:edge-agent"
    entrypoint: ["demo-worker", "infinity"]
    stop_grace_period: 1s
    depends_on:
      - edge-agent

volumes:
  pgdata:
  rosctl:
