[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openfleet-backend"
version = "0.1.0"
description = "OpenFleet Replay backend: observability, incidents, and replay for ROS 2 fleets"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "httpx>=0.27",  # openfleet CLI
    "pyyaml>=6.0",  # openfleet CLI regression config
    "redis>=5.0",  # realtime fan-out between replicas (DECISIONS #025)
    "pyjwt[crypto]>=2.8",  # verifying OIDC ID tokens (DECISIONS #038)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
openfleet = "openfleet_cli.main:main"

[tool.setuptools.packages.find]
include = ["app*", "openfleet_cli*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = [
    # Third-party: Starlette's TestClient (used only for the WebSocket test) on httpx.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Generated migrations contain long SQL literals.
"alembic/versions/*" = ["E501"]
