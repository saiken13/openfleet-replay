name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openfleet
          POSTGRES_PASSWORD: openfleet
          POSTGRES_DB: openfleet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openfleet -d openfleet"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      OPENFLEET_DATABASE_URL: postgresql+asyncpg://openfleet:openfleet@localhost:5432/openfleet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: pytest -v
