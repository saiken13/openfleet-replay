name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openfleet
          POSTGRES_PASSWORD: openfleet
          POSTGRES_DB: openfleet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openfleet -d openfleet"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      OPENFLEET_DATABASE_URL: postgresql+asyncpg://openfleet:openfleet@localhost:5432/openfleet
      OPENFLEET_TEST_REDIS_URL: redis://localhost:6379/15
      OPENFLEET_TEST_REDIS_REQUIRED: "1"  # the bus tests must not silently skip here
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: alembic check  # ORM models and migrations must agree
      - run: pytest -v

  simulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: simulator/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # C++ edge agent (docs/EMBEDDED_ROADMAP.md). The runner is x86_64: native builds with
  # sanitizers, then a real cross-compile to aarch64 whose tests run under qemu-aarch64
  # (emulated user-mode, not ARM hardware).
  edge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - run: >-
          sudo apt-get update && sudo apt-get install -y ninja-build libcurl4-openssl-dev
          g++-aarch64-linux-gnu qemu-user clang libclang-rt-18-dev
      # TSan can't map its shadow memory with Ubuntu 24.04's default ASLR entropy.
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Native (library, tests and the agent binary)
        run: |
          cmake --preset native && cmake --build --preset native && ctest --preset native
          build/native/openfleet-edge-agent --version
      - name: AddressSanitizer + UBSan
        run: cmake --preset asan && cmake --build --preset asan && ctest --preset asan
      - name: ThreadSanitizer
        run: cmake --preset tsan && cmake --build --preset tsan && ctest --preset tsan
      # libFuzzer on the device protocol decoder and the gateway (DECISIONS #033), from a
      # seed corpus of valid frames. Any crash, sanitizer report or failed property fails CI.
      - name: Fuzz (libFuzzer + ASan + UBSan, 45 s per target)
        run: |
          cmake --preset fuzz && cmake --build --preset fuzz
          mkdir -p build/fuzz/corpus/decoder build/fuzz/corpus/gateway
          build/fuzz/protocol/make_seeds build/fuzz/corpus/decoder
          build/fuzz/protocol/fuzz_decoder -max_total_time=45 -max_len=2048 build/fuzz/corpus/decoder
          build/fuzz/fuzz_gateway -max_total_time=45 -max_len=4096 build/fuzz/corpus/gateway
      # The runner has no aarch64 libcurl, so this builds and tests edge_core (everything but
      # the HTTP transport) and skips the agent binary.
      - name: Cross-compile for aarch64, run tests under qemu-aarch64
        run: |
          cmake --preset aarch64 && cmake --build --preset aarch64
          file build/aarch64/edge_tests | grep -q "ARM aarch64"
          ctest --preset aarch64

  # The C++ agent in a container against the real backend (compose profile `edge`): CPU load
  # opens high_cpu, a stopped process opens node_health, a backend outage loses no batch,
  # SIGTERM ends the run ABORTED. Then the device gateway against the simulated MCU: a
  # stopped sensor, resets, a corrupted link, silence, a failed task, reconnects.
  # Simulated load and a simulated device on a CI VM, not robot hardware.
  # The three e2e scripts wait in real time (outage, load, hysteresis, reset hold), so they
  # run as parallel jobs. They build their own images, so they don't wait for `edge` or
  # `firmware` either: the job takes as long as its slowest script, not the sum.
  edge-agent-e2e:
    runs-on: ubuntu-latest
    needs: [backend]
    strategy:
      fail-fast: false
      matrix:
        script: [edge/e2e/e2e.py, edge/e2e/device_e2e.py, firmware/tests/firmware_e2e.py]
    name: edge-agent-e2e (${{ matrix.script }})
    env:
      PYTHONUNBUFFERED: "1"  # stage lines get real timestamps in the log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx ruff
      - run: ruff check edge firmware && ruff format --check edge firmware
      - run: python ${{ matrix.script }}
      - if: failure()
        run: docker compose --profile edge --profile firmware logs edge-agent device-sim renode backend

  # FreeRTOS firmware for the STM32F407 (docs/FIRMWARE.md), built with arm-none-eabi-gcc and
  # run on Renode's emulated STM32F4: boot and protocol conformance (read by an independent
  # Python decoder), a stalled task -> watchdog reset -> cause reported, a slow link without
  # a reset, GDB through Renode, and the Robot Framework suite in emulated time. Emulated
  # hardware, not a board.
  firmware:
    runs-on: ubuntu-latest
    env:
      RENODE_VERSION: "1.17.0"
    steps:
      - uses: actions/checkout@v4
      - run: >-
          sudo apt-get update && sudo apt-get install -y ninja-build gcc-arm-none-eabi
          libnewlib-arm-none-eabi gdb-multiarch netcat-openbsd
      - name: Install Renode
        run: |
          curl -fsSL "https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable.tar.gz" | sudo tar xz -C /opt
          sudo ln -s "/opt/renode_${RENODE_VERSION}-portable/renode" /usr/local/bin/renode
          sudo ln -s "/opt/renode_${RENODE_VERSION}-portable/renode-test" /usr/local/bin/renode-test
          pip install -r "/opt/renode_${RENODE_VERSION}-portable/tests/requirements.txt"
      - name: Build (prints flash/RAM usage)
        run: cmake -S firmware -B firmware/build -G Ninja && cmake --build firmware/build
      - name: Run on Renode
        working-directory: /opt/renode_${{ env.RENODE_VERSION }}-portable
        run: python3 "$GITHUB_WORKSPACE/firmware/tests/renode_test.py"
      - name: GDB through Renode
        working-directory: /opt/renode_${{ env.RENODE_VERSION }}-portable
        run: timeout 120 "$GITHUB_WORKSPACE/firmware/renode/gdb_check.sh"
      # Robot Framework on Renode, driven in emulated time (deterministic on any runner).
      - name: Robot Framework suite
        run: firmware/renode/tests/run.sh "$RUNNER_TEMP/robot"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-robot
          path: ${{ runner.temp }}/robot/

  collector:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]  # ROS 2 Humble / Jazzy system Pythons
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -v

  # Real ROS 2 Jazzy: a fake robot publishing /scan + the collector + the backend.
  ros2-collector-e2e:
    runs-on: ubuntu-latest
    needs: [backend, collector]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - run: python collector/ros_test/e2e.py
      - if: failure()
        run: docker compose --profile ros logs ros-collector ros-robot backend

  # The product's own story, as a gate: a healthy run must pass the regression config,
  # and the scripted LiDAR regression must FAIL it (exit code 1).
  e2e-regression-check:
    runs-on: ubuntu-latest
    needs: [backend, simulator]
    env:
      OPENFLEET_TOKEN: ofu_demo_viewer_public-not-secret  # public demo viewer token (compose seeds it)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: docker compose up -d --build --wait postgres backend
      - run: pip install -e backend -e simulator
      - name: Healthy baseline run
        run: openfleet-sim -s simulator/scenarios/healthy.yaml --fast -o base.json --keys examples/demo-robot-keys.json
      - name: Regression candidate run
        run: openfleet-sim -s simulator/scenarios/lidar_regression.yaml --fast -o cand.json --keys examples/demo-robot-keys.json
      - name: Baseline passes the regression config
        run: openfleet check "$(jq -r '.[0].run_id' base.json)" -c examples/regression.yaml
      - name: Regression is caught (expects exit code 1)
        run: |
          set +e
          openfleet check "$(jq -r '.[0].run_id' cand.json)" -c examples/regression.yaml \
            --baseline "$(jq -r '.[0].run_id' base.json)"
          code=$?
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }
      # Re-detection gate (DECISIONS #023): today's rules must still catch every incident the
      # regression run recorded. Asserting caught >= 1 keeps a run that recorded nothing from
      # passing vacuously.
      - name: Current rules still detect the recorded incidents
        run: |
          openfleet redetect "$(jq -r '.[0].run_id' cand.json)" --fail-on-missed --json > redetect.json
          jq -e '.caught >= 1 and .missed == 0' redetect.json
      - name: Re-detection gate fails when rules stop catching it (expects exit code 1)
        run: |
          set +e
          openfleet redetect "$(jq -r '.[0].run_id' cand.json)" --fail-on-missed \
            --set topic_degraded_ratio=0.4
          code=$?
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }
      # Heartbeat spans (DECISIONS #028): telemetry stalls for 25 s while the robot keeps
      # heartbeating. The replay must see a live robot with stale data (the degraded /scan
      # is caught), not a silent one (no new heartbeat_missing).
      - name: Telemetry stall is not replayed as silence
        run: |
          openfleet-sim -s simulator/scenarios/telemetry_stall.yaml --fast -o stall.json --keys examples/demo-robot-keys.json
          openfleet redetect "$(jq -r '.[0].run_id' stall.json)" --json > stall-redetect.json
          jq -e '.caught >= 1 and .missed == 0 and .new == 0' stall-redetect.json
      - if: failure()
        run: docker compose logs backend

  # Two backend replicas behind a round-robin nginx (compose profile `replicas`): realtime
  # events must reach WebSockets on every replica, and survive a Redis pub/sub drop.
  e2e-multi-replica:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: docker compose --profile replicas up -d --build --wait postgres redis backend backend-2 lb
      - run: pip install -e backend
      - run: python scripts/multi_replica_e2e.py
      - if: failure()
        run: docker compose --profile replicas logs backend backend-2 lb
