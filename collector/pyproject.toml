[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openfleet-collector"
version = "0.1.0"
description = "ROS 2 collector for OpenFleet Replay: measures topic rates, node health and system metrics on the robot and streams aggregated batches"
license = "Apache-2.0"
requires-python = ">=3.10"
# rclpy is NOT listed: it comes from the ROS 2 installation (source /opt/ros/<distro>/setup.bash).
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
openfleet-collector = "openfleet_collector.main:main"

[tool.setuptools.packages.find]
include = ["openfleet_collector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
